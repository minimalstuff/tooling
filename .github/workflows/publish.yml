name: CI & Publish

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        required: true
      prerelease:
        description: Publish a prerelease under the next dist-tag
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: "@minimalstuff/tooling"
  PACK_DIRECTORY: ${{ github.workspace }}/pack
  ARTIFACT_NAME: package-tarball

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      increment: ${{ inputs.increment }}
      release-script: ${{ inputs.prerelease && 'release:next' || 'release' }}
      check-release-command: node src/cli/index.ts check-release
    secrets:
      release-deploy-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

  build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.node-version.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Read Node version
        id: node-version
        run: |
          set -euo pipefail
          echo "node-version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$PACK_DIRECTORY"
          pnpm pack --pack-destination "$PACK_DIRECTORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACK_DIRECTORY }}/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACK_DIRECTORY }}

      - name: Verify release tag matches package version
        id: package
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          TARBALL=$(ls "$PACK_DIRECTORY"/*.tgz)
          VERSION=$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$VERSION" >&2
            exit 1
          fi
          TAG=$([[ "$VERSION" == *-* ]] && echo "next" || echo "latest")
          {
            echo "tarball=$TARBALL"
            echo "version=$VERSION"
            echo "dist-tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: ${{ steps.package.outputs.dist-tag }}
        run: npm publish "$TARBALL" --tag "$DIST_TAG" --provenance --ignore-scripts

      - name: Verify provenance attestation
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            ATTESTATIONS=$(npm view "$PACKAGE_NAME@$VERSION" dist.attestations --json 2>/dev/null || true)
            if [[ -n "$ATTESTATIONS" && "$ATTESTATIONS" != "null" ]]; then
              echo "Attestations found for $PACKAGE_NAME@$VERSION"
              exit 0
            fi
            echo "Attempt $attempt: no attestations yet"
            sleep 10
          done
          echo "No provenance attestations found for $PACKAGE_NAME@$VERSION" >&2
          exit 1
